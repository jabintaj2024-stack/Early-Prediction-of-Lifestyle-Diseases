<!DOCTYPE html>
<html>
<head>
    <title>Lifestyle Disease Risk Prediction</title>
</head>
<body>
    <h2>Lifestyle Disease Risk Prediction</h2>

    <form action="/predict" method="post">
        Age: <input type="number" name="age" required><br><br>

        Gender (0=Female, 1=Male):
        <input type="number" name="gender" required><br><br>

        BMI: <input type="number" name="bmi" required><br><br>

        Smoking (0=No,1=Yes):
        <input type="number" name="smoking" required><br><br>

        Exercise (0=None,1=Regular):
        <input type="number" name="exercise" required><br><br>

        Drinking (0=No,1=Yes):
        <input type="number" name="drinking" required><br><br>

        Sleep Hours:
        <input type="number" name="sleep" required><br><br>

        Junk Food per week:
        <input type="number" name="junk" required><br><br>

        <input type="submit" value="Predict Risk">
    </form>
</body>
</html>
